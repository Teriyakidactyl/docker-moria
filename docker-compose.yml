services:
  moria-server:
    image: ghcr.io/teriyakidactyl/docker-moria:latest
    build:
      context: .
      args:
        BASE_TAG: ${BASE_TAG:-trixie_wine-staging}
    container_name: moria-server
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      SERVER_LISTEN_ADDRESS: ${SERVER_LISTEN_ADDRESS:-0.0.0.0}
      SERVER_PORT: ${SERVER_PORT:-7777}
      SERVER_ADVERTISE_ADDRESS: ${SERVER_ADVERTISE_ADDRESS:-auto}
      SERVER_ADVERTISE_PORT: ${SERVER_ADVERTISE_PORT:-7777}
      SERVER_INITIAL_CONNECTION_RETRY_TIME: ${SERVER_INITIAL_CONNECTION_RETRY_TIME:-60}
      SERVER_AFTER_DISCONNECTION_RETRY_TIME: ${SERVER_AFTER_DISCONNECTION_RETRY_TIME:-600}
      SERVER_CONSOLE_ENABLED: ${SERVER_CONSOLE_ENABLED:-true}
      SERVER_FPS: ${SERVER_FPS:-60}
      SERVER_LOADED_AREA_LIMIT: ${SERVER_LOADED_AREA_LIMIT:-12}
      SERVER_PASS: ${SERVER_PASS:-}
      WORLD_NAME: ${WORLD_NAME:-Moria Docker World}
      WORLD_FILE: ${WORLD_FILE:-}
      WORLD_TYPE: ${WORLD_TYPE:-campaign}
      WORLD_SEED: ${WORLD_SEED:-random}
      WORLD_DIFFICULTY_PRESET: ${WORLD_DIFFICULTY_PRESET:-normal}
      WORLD_DIFFICULTY_COMBAT: ${WORLD_DIFFICULTY_COMBAT:-default}
      WORLD_DIFFICULTY_ENEMY_AGGRESSION: ${WORLD_DIFFICULTY_ENEMY_AGGRESSION:-high}
      WORLD_DIFFICULTY_SURVIVAL: ${WORLD_DIFFICULTY_SURVIVAL:-default}
      WORLD_DIFFICULTY_MINING_DROPS: ${WORLD_DIFFICULTY_MINING_DROPS:-default}
      WORLD_DIFFICULTY_WORLD_DROPS: ${WORLD_DIFFICULTY_WORLD_DROPS:-default}
      WORLD_DIFFICULTY_HORDE_FREQUENCY: ${WORLD_DIFFICULTY_HORDE_FREQUENCY:-default}
      WORLD_DIFFICULTY_SIEGE_FREQUENCY: ${WORLD_DIFFICULTY_SIEGE_FREQUENCY:-default}
      WORLD_DIFFICULTY_PATROL_FREQUENCY: ${WORLD_DIFFICULTY_PATROL_FREQUENCY:-default}
      WORLD_OPTIONAL_DLC: ${WORLD_OPTIONAL_DLC:-DurinsFolk}
      WORLD_UPGRADE_OPTIONAL_DLC: ${WORLD_UPGRADE_OPTIONAL_DLC:-}
      SERVER_WORKER_THREADS: ${SERVER_WORKER_THREADS:-4}
      STEAM_VALIDATE: ${STEAM_VALIDATE:-false}
      UPDATE_ON_START: ${UPDATE_ON_START:-true}
    ports:
      # Published Docker port is separate from Moria's AdvertisePort so the
      # native -1 ("use ListenPort") value remains representable.
      - "${SERVER_PUBLISHED_PORT:-7777}:${SERVER_PORT:-7777}/udp"
    volumes:
      - moria_app:/app
      - moria_world:/world

volumes:
  moria_app:
    name: moria_app
  moria_world:
    name: moria_world
